version: "3.9"

services:

  nginx:
    image: ${DOCKERHUB_USERNAME}/cloudproject-nginx:latest
    ports:
      - "80:80"
    networks: [frontend]
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.hostname
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

  app:
    image: ${DOCKERHUB_USERNAME}/cloudproject:latest
    environment:
      DATABASE_URL: postgresql://cloudproject:cloudproject@postgres:5432/cloudproject
      REDIS_URL: redis://redis:6379/0
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 3
      placement:
        preferences:
          - spread: node.hostname
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 15s

  worker:
    image: ${DOCKERHUB_USERNAME}/cloudproject:latest
    command: python worker.py
    environment:
      DATABASE_URL: postgresql://cloudproject:cloudproject@postgres:5432/cloudproject
      REDIS_URL: redis://redis:6379/0
    networks: [backend]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure
        delay: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudproject
      POSTGRES_PASSWORD: cloudproject
      POSTGRES_DB: cloudproject
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      - source: init_sql
        target: /docker-entrypoint-initdb.d/10-init.sql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudproject -d cloudproject"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cloudproject.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [backend, frontend]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  pgdata:
  pgadmin_data:

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
    internal: true

configs:
  init_sql:
    file: db/init.sql
