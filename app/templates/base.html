<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CloudProject{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">CloudProject</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Проекты</a>
            <a class="nav-link" href="/employees">Сотрудники</a>
        </div>
    </div>
</nav>

<main class="container py-4 flex-grow-1">
    {% block content %}{% endblock %}
</main>

<footer class="container py-3 text-muted small border-top">
    CloudProject – корпоративная система управления проектами
</footer>

<script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
